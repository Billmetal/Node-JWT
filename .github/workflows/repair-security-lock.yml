name: Repair security lockfile
on:
  push:
    branches: [fix/dependabot-qs-security]
    paths: [.github/workflows/repair-security-lock.yml]
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dependabot-qs-security
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lockfile without install scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify reproducible installation without install scripts
        run: npm ci --ignore-scripts
      - name: Verify targeted dependency versions
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const lock = require('./package-lock.json');
          const qs = Object.entries(lock.packages).filter(([p]) => p.endsWith('node_modules/qs'));
          assert(qs.length > 0, 'qs missing from lockfile');
          for (const [p, pkg] of qs) assert.equal(pkg.version, '6.16.0', p);
          assert.match(lock.packages['node_modules/express'].version, /^4\./);
          NODE
      - name: Commit only generated lockfile to fix branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(security): regenerate lockfile for express 4 and qs 6.16.0'
            git push origin HEAD:refs/heads/fix/dependabot-qs-security
          fi
